spring:
  application:
    name: portai
  profiles:
    active: local

  # DB 접속 정보
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/portai?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC&characterEncoding=UTF-8
    username: root
    password: 여기에_본인의_DB_비밀번호를_적어주세요

  jpa:
    hibernate:
      ddl-auto: update
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: 8080

logging:
  level:
    com.portai: debug
    org.hibernate.SQL: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# JWT 설정
jwt:
  secret: vmfldptmxhzhfhtkfkdgoqnwkdudnjsgkfRjdi12345!@#
  expiration_time: 1800000 # Access Token 수명: 30분 (1800000밀리초)
  refresh_expiration_time: 1209600000 # Refresh Token 수명: 14일 (1209600000밀리초)

llm:
  provider: mock

openai:
  api-key: ${OPENAI_API_KEY:}
  model: gpt-5.6-luna
  base-url: https://api.openai.com/v1
  timeout-seconds: 30