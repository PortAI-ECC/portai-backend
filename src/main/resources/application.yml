spring:
  application:
    name: resume_service

  profiles:
    active: ${SPRING_PROFILES_ACTIVE:local}

  # DB 접속 정보
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL}
    username: ${DB_USERNAME}
    password: ${DB_PASSWORD}

  jpa:
    hibernate:
      # DB 날림 방지 반영: 환경변수가 없으면 기본값인 update를 쓰고,
      # Railway에서 변수를 주면 그 값(validate)으로 덮어쓰도록 세팅
      ddl-auto: ${DDL_AUTO:update}
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 100
    open-in-view: false

  jackson:
    property-naming-strategy: SNAKE_CASE
    default-property-inclusion: non_null

server:
  port: ${PORT:8080}
  # 프록시(Railway)가 넘겨주는 프로토콜(HTTPS) 정보를 스프링 부트가 올바르게 인식하도록 함
  forward-headers-strategy: native

logging:
  level:
    com.portai: debug
    org.hibernate.SQL: debug

springdoc:
  swagger-ui:
    path: /swagger-ui.html
    operations-sorter: method

# JWT 설정
jwt:
  secret: ${JWT_SECRET}
  expiration_time: ${JWT_EXPIRATION_TIME:1800000}
  refresh_expiration_time: ${JWT_REFRESH_EXPIRATION_TIME:1209600000}